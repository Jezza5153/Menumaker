<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De Tafelaar — menukaart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Sorts+Mill+Goudy:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style id="pagerule">@page{size:A5;margin:0}</style>

<style>
/* kleuren gemeten uit De_Tafelaar_menu_januari_versie.pdf */
:root{
  --burg:#481723; --tan:#D6C19B; --wood:#BEA271; --mauve:#A38B91;
  --line:#5F3817; --ink:#231F20; --ink-hd:#110F0E; --paper:#FFFFFF;
  --veg:#5D7A38; --glut:#D8C54B; --lact:#FBF9FB; --brood:#C2703A;
  --body:16pt; --lead:19.2pt; --hd:1;
  --ui-bg:#17131A; --ui-panel:#221C26; --ui-line:#3A303F;
  --ui-text:#EDE6E9; --ui-dim:#A0929C; --ui-accent:#B98AA8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ui-bg);color:var(--ui-text);font-family:'Inter',system-ui,sans-serif;font-size:14px}

.app{display:grid;grid-template-columns:minmax(340px,420px) 1fr;height:100vh}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}}
.editor{overflow-y:auto;border-right:1px solid var(--ui-line);background:var(--ui-panel)}
.stage{overflow:auto;background:#0E0B10;padding:26px 16px 60px;position:relative}
.bar{position:sticky;top:0;z-index:5;background:var(--ui-panel);border-bottom:1px solid var(--ui-line);
     padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar h1{font-family:'Bevan',serif;font-size:15px;font-weight:400;margin:0 auto 0 0;color:var(--tan)}
button{font-family:inherit;font-size:12.5px;font-weight:500;background:#2E2633;color:var(--ui-text);
       border:1px solid var(--ui-line);border-radius:7px;padding:7px 11px;cursor:pointer}
button:hover{background:#3A2F40}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px}
button.primary{background:var(--burg);border-color:#6B2141;color:#F6E8EF}
button.primary:hover{background:#5E1735}
button.on{background:var(--ui-accent);border-color:var(--ui-accent);color:#20161C}
button.mini{padding:3px 7px;font-size:11px;line-height:1.2}
button.ghost{background:transparent}
.status{font-size:11.5px;color:var(--ui-dim);border:1px solid var(--ui-line);
        border-radius:999px;padding:4px 10px}
.status.ok{color:#7BD8A8;border-color:#2F5B46}
.status.busy{color:#E8C76A;border-color:#5B4B2A}
.status.err{color:#F09A9A;border-color:#5B2F2F}
.tabs{display:inline-flex;align-items:center;gap:3px;background:#1B161F;
      border:1px solid var(--ui-line);border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--ui-dim);padding:5px 11px;border-radius:6px}
.tabs button:hover{background:#2E2633;color:var(--ui-text)}
.tabs button.actief{background:var(--burg);color:#F6E8EF}
.tabs button.plus{color:var(--ui-dim);font-size:15px;line-height:1;padding:4px 9px}
.sizer{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ui-dim);
       border:1px solid var(--ui-line);border-radius:7px;padding:3px 6px}
.sizer output{min-width:38px;text-align:center;color:var(--ui-text);font-variant-numeric:tabular-nums}

.sec{border-bottom:1px solid var(--ui-line);padding:16px}
.sec>header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec>header h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ui-dim)}
.sec>header .count{font-size:11px;color:#6E6274;margin-left:auto}
.row.drag{opacity:.35}
.row.over{box-shadow:0 -2px 0 0 var(--ui-accent)}
.grab{cursor:grab;color:#6E6274;padding:0 3px;user-select:none;font-size:13px}
.row select{font-family:inherit;font-size:11.5px;background:#100D13;color:var(--ui-dim);
       border:1px solid var(--ui-line);border-radius:6px;padding:4px 6px;max-width:140px}
.insp textarea{font-family:inherit;font-size:13px;background:#100D13;color:var(--ui-text);
       border:1px solid var(--ui-line);border-radius:6px;padding:6px 8px;width:100%;min-height:52px;resize:vertical}
.wide{grid-column:1 / -1}
.row{background:#1B161F;border:1px solid var(--ui-line);border-radius:9px;padding:10px;margin-bottom:9px}
.row .l1{display:flex;gap:7px;margin-bottom:6px}
.row input,.row textarea{font-family:inherit;font-size:13px;background:#100D13;color:var(--ui-text);
       border:1px solid var(--ui-line);border-radius:6px;padding:6px 8px;width:100%}
.row input.price{width:74px;flex:none;text-align:right}
.row input.kleur{width:34px;flex:none;padding:2px;height:32px;background:#100D13;cursor:pointer}
.row textarea{resize:vertical;min-height:34px;line-height:1.35}
.row .l2{display:flex;gap:7px;align-items:center;margin-top:6px}
.tags{display:flex;gap:4px}
.tag{width:22px;height:22px;border-radius:50%;border:1px solid var(--ui-line);cursor:pointer;padding:0;
     opacity:.34;font:600 11px 'Inter',system-ui,sans-serif;color:#fff}
.tag[data-t="g"],.tag[data-t="l"],.tag[data-it="g"],.tag[data-it="l"]{color:#2A2416}
.tag:hover{opacity:.6}
.tag.on{opacity:1;box-shadow:0 0 0 2px #4B3D52}
.tag[data-t="v"],.tag[data-it="v"]{background:var(--veg)}
.tag[data-t="g"],.tag[data-it="g"]{background:var(--glut)}
.tag[data-t="l"],.tag[data-it="l"]{background:var(--lact)}
.tag[data-t="b"],.tag[data-it="b"]{background:var(--brood)}
.dieet{font-size:11px;color:var(--ui-dim);min-width:104px}
.pagnr{display:inline-block;min-width:20px;color:#6E6274;font-size:12px}
.pagnaam{font-size:13px}
.rowtools{margin-left:auto;display:flex;gap:4px}
textarea.big{font-family:inherit;font-size:13px;line-height:1.45;width:100%;background:#100D13;color:var(--ui-text);
       border:1px solid var(--ui-line);border-radius:8px;padding:9px;min-height:120px}
.hint{font-size:11.5px;color:var(--ui-dim);margin:0 0 10px;line-height:1.45}

/* ---------- inspecteur ---------- */
.insp{position:fixed;right:18px;bottom:18px;width:268px;z-index:20;background:var(--ui-panel);
      border:1px solid var(--ui-line);border-radius:12px;padding:13px;box-shadow:0 14px 44px rgba(0,0,0,.6)}
.insp[hidden]{display:none}
.insp h3{margin:0 0 3px;font-size:13px;font-weight:600}
.insp .sub{font-size:11px;color:var(--ui-dim);margin-bottom:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ui-dim)}
.fld input{font-family:inherit;font-size:13px;background:#100D13;color:var(--ui-text);
      border:1px solid var(--ui-line);border-radius:6px;padding:5px 7px;width:100%;
      font-variant-numeric:tabular-nums}
.insp footer{display:flex;gap:6px;margin-top:11px}
.insp footer button{flex:1}

/* ---------- de kaart ---------- */
.preview{width:max-content;margin:0 auto}
.page{-webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative;isolation:isolate;width:148mm;height:210mm;background:var(--tan);overflow:hidden;
      margin:0 auto 16px;box-shadow:0 10px 40px rgba(0,0,0,.55);
      font-family:'Sorts Mill Goudy',Georgia,serif;color:var(--ink)}
.page img{display:block;width:148mm;height:210mm}

/* twee A5-kaarten naast elkaar op een liggende A4 */
.a4{position:relative;width:297mm;height:210mm;display:flex;justify-content:center;
    background:#fff;margin:0 auto 16px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
.a4 .page{margin:0;box-shadow:none}
.a4 .pagetag{display:none}
.a4.gedraaid{transform:rotate(180deg)}
/* drukwerk: 3 mm afloop rondom, beeld loopt door tot over de snijrand */
.druk .page{width:154mm;height:216mm;padding:3mm}
.druk .page img{width:154mm;height:216mm;margin:-3mm}
/* hulplijnen voor drukwerk: snijrand en veiligheidsmarge */
.rand{position:absolute;pointer-events:none;z-index:45}
.rand.snij{inset:0;outline:.3mm dashed rgba(255,122,156,.95);outline-offset:-.15mm}
.rand.veilig{inset:5mm;outline:.3mm dashed rgba(49,224,196,.95)}
.randlabel{position:absolute;left:1mm;bottom:1mm;z-index:46;pointer-events:none;
           font:600 2.4mm 'Inter',system-ui,sans-serif;color:rgba(49,224,196,.95)}
.snij{position:absolute;left:148.5mm;width:.2mm;height:5mm;background:#8A8A8A}
.snij.t{top:0}.snij.b{bottom:0}
.velnaam{position:absolute;left:0;top:-15px;font-family:'Inter',sans-serif;font-size:10px;
         letter-spacing:.1em;text-transform:uppercase;color:#6E6274}

.deco{position:absolute;background:var(--wood)}
.frame{position:absolute;border:.75mm solid var(--line)}
.hd{position:absolute;font-family:'Bevan',serif;font-weight:400;line-height:1;white-space:nowrap;
    transform:scaleX(.84);transform-origin:left top}
.hd.r{transform-origin:right top;text-align:right}
.hd.fill{color:var(--paper)}
.hd.ink{color:var(--ink-hd)}
.hd.burg{color:var(--burg)}
.hd.outline{color:transparent;-webkit-text-stroke:.4mm var(--paper)}
.bar-burg{position:absolute;background:var(--burg)}
.rule{position:absolute;background:var(--paper)}

.block{position:absolute;display:grid;align-content:start;overflow:hidden;row-gap:var(--lead)}
.block .pricebg{position:absolute;top:0;bottom:0;right:0;background:var(--mauve)}
.block.dark{background:var(--burg);color:var(--paper)}
.block.light{color:var(--ink)}
.block .it{z-index:1}
.block .nm{font-size:var(--fsN,var(--body));line-height:1.2}
.block .nm .dot{margin-left:1.2mm}
.nw{white-space:nowrap}
.block .ds{font-size:var(--fsD,var(--body));line-height:1.2}
.block .pr{font-size:var(--fsP,var(--body));line-height:1.2;text-align:center;align-self:start;z-index:1}
.editing .it,.editing .pr{cursor:text}
.it.selitem,.pr.selitem{outline:1.5px dashed var(--ui-accent);outline-offset:2px}
.dot{width:2.6mm;height:2.6mm;border-radius:50%;display:inline-block;flex:none;position:relative;
     vertical-align:baseline;transform:translateY(-.3mm)}
.dot::before{content:'';position:absolute;inset:-2.2mm;border-radius:50%}
.dot i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       font:600 1.7mm/1 'Inter',system-ui,sans-serif;font-style:normal;letter-spacing:0}
.dot.v i{color:#FFFFFF} .dot.g i{color:#3A3313} .dot.l i{color:#3A3313} .dot.b i{color:#FFFFFF}
.dot.v{background:var(--veg)}.dot.g{background:var(--glut)}
.dot.l{background:var(--lact)}.dot.b{background:var(--brood)}

.boxed{position:absolute;border:.75mm solid var(--line);display:flex;align-items:center;justify-content:center;
       text-align:center;font-size:var(--body);line-height:var(--lead);padding:3mm;overflow:hidden}
.legend{position:absolute;background:var(--burg);color:var(--paper);font-size:calc(var(--body)*.875);
        line-height:var(--lead);padding:3mm;display:flex;flex-direction:column;justify-content:space-around}
.legend div{display:flex;align-items:center;gap:2.4mm}
.legend div{align-items:flex-start}
.legend em{display:block;font-style:normal;font-size:.74em;line-height:1.2;opacity:.92}
.legend .dot{width:3.4mm;height:3.4mm}
.subk{position:absolute;font-family:'Sorts Mill Goudy',Georgia,serif;font-style:italic;
      line-height:1.25;white-space:pre-wrap}
.subk.burg{color:var(--burg)} .subk.ink{color:var(--ink-hd)} .subk.fill{color:var(--paper)}
.vtab{position:absolute;writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Bevan',serif;
      color:transparent;-webkit-text-stroke:.35mm var(--paper);line-height:1}

/* ---------- bewerkstand ---------- */
.editing [data-el]{cursor:move}
.editing [data-el]:hover{outline:1px dashed rgba(185,138,168,.85);outline-offset:1px}
[data-el].sel{outline:1.5px solid var(--ui-accent)!important;outline-offset:1px}
.guide{position:absolute;background:#31E0C4;z-index:40;pointer-events:none}
.guide.v{top:0;bottom:0;width:1px}
.guide.h{left:0;right:0;height:1px}
.guide.edge{background:#FF7A9C}
.guide.home{background:#E8C76A}
/* regelraster binnen een blok, alleen zichtbaar tijdens slepen */
.rasterlijn{position:absolute;left:0;right:0;height:1px;z-index:40;pointer-events:none;
            background:rgba(49,224,196,.3)}
.rasterlijn.aan{background:#31E0C4;box-shadow:0 0 0 .5px rgba(49,224,196,.45)}
.rasterlijn.nul{background:#E8C76A}
.rasterlijn.nul.aan{background:#E8C76A;box-shadow:0 0 0 .5px rgba(232,199,106,.5)}
.raster-v{position:absolute;top:0;bottom:0;width:1px;z-index:40;pointer-events:none;background:#E8C76A}
.tip{position:fixed;z-index:70;pointer-events:none;background:#F3ECEF;color:#20161C;
     border-radius:6px;padding:4px 9px;font:600 12px 'Inter',system-ui,sans-serif;
     box-shadow:0 4px 14px rgba(0,0,0,.45);white-space:nowrap}
.tip[hidden]{display:none}
.hud{position:fixed;z-index:60;pointer-events:none;background:#221C26;color:var(--ui-text);
     border:1px solid var(--ui-line);border-radius:7px;padding:4px 9px;
     font:11.5px 'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums;
     box-shadow:0 6px 20px rgba(0,0,0,.5)}
.rz{position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;border-radius:3px;
    background:var(--ui-accent);border:1px solid #20161C;cursor:nwse-resize;z-index:30}
.pagetag{position:absolute;left:0;top:-15px;font-family:'Inter',sans-serif;font-size:10px;
         letter-spacing:.1em;text-transform:uppercase;color:#6E6274}

@media print{
  body{background:#fff}
  .page,.page *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .app{display:block;height:auto}
  .editor,.insp{display:none}
  .stage{overflow:visible;padding:0;background:#fff}
  .preview{zoom:1!important;width:auto;margin:0}
  .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .a4{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .a4:last-child{break-after:auto;page-break-after:auto}
  .a4 .page{break-after:auto;page-break-after:auto}
  .velnaam{display:none}
  .pagetag,.rz,.guide,.rand,.randlabel{display:none}
  [data-el]{outline:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="editor">
    <div class="bar">
      <h1>Menukaart</h1>
      <button class="primary" id="print">Print</button>
      <button class="primary" id="pdf">PDF maken</button>
      <button id="save">Bewaar</button>
      <button id="load">Open</button>
      <span class="tabs" id="kaart"></span>
      <button id="undo" title="Ongedaan maken (Cmd+Z)">↶</button>
      <button id="redo" title="Opnieuw (Cmd+Shift+Z)">↷</button>
      <button id="edit">Indeling bewerken</button>
      <button id="snap" class="on">Uitlijnhulp</button>
      <button id="randen">Marges tonen</button>
      <button id="check">Marges nakijken</button>
      <button id="veilig">Alles op 5 mm</button>
      <button id="opzet">Print: los A5</button>
      <button id="omslag" hidden>Omslaan: lange zijde</button>
      <div class="sizer"><span>Titel</span>
        <button class="mini" data-sz="nm" data-d="-.5">−</button><output id="szNm">16</output>
        <button class="mini" data-sz="nm" data-d=".5">+</button></div>
      <div class="sizer"><span>Omschr.</span>
        <button class="mini" data-sz="ds" data-d="-.5">−</button><output id="szDs">16</output>
        <button class="mini" data-sz="ds" data-d=".5">+</button></div>
      <div class="sizer"><span>Kadertekst</span>
        <button class="mini" data-sz="body" data-d="-.5">−</button><output id="szBody">16</output>
        <button class="mini" data-sz="body" data-d=".5">+</button></div>
      <div class="sizer"><span>Koppen</span>
        <button class="mini" data-sz="hd" data-d="-.05">−</button><output id="szHd">100%</output>
        <button class="mini" data-sz="hd" data-d=".05">+</button></div>
      <span class="status" id="status" hidden>—</span>
      <div class="sizer"><span>Zoom</span>
        <button class="mini" data-zm="-.1">−</button><output id="szZoom">85%</output>
        <button class="mini" data-zm=".1">+</button></div>
    </div>
    <div id="form"></div>
  </div>
  <div class="stage"><div class="preview" id="preview"></div></div>
</div>

<aside class="insp" id="insp" hidden>
  <h3 id="iName">—</h3>
  <div class="sub" id="iSub"></div>
  <div class="grid2" id="iFields"></div>
  <footer>
    <button class="mini" id="iReset">Origineel</button>
    <button class="mini" id="iClose">Sluiten</button>
  </footer>
</aside>

<input type="file" id="file" accept="application/json" hidden>

let INST={leg:{}, letters:false};
const legKleur=k=>(INST.leg[k]||{}).kleur || STDKLEUR[k];
function contrast(hex){
  const h=(hex||'').replace('#','');
  const v=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const r=parseInt(v.slice(0,2),16)||0, g=parseInt(v.slice(2,4),16)||0, b=parseInt(v.slice(4,6),16)||0;
  return (0.299*r+0.587*g+0.114*b)>150 ? '#2A2416' : '#FFFFFF';
}
const legLabel=k=>(INST.leg[k]||{}).label || TAGS[k];
const legExtra=k=>(INST.leg[k]||{}).extra || '';
function legZet(k,veld,waarde){
  INST.leg[k]=INST.leg[k]||{}; INST.leg[k][veld]=waarde; instBewaar();
}
function migreerLegenda(){
  if(m.legenda && !legExtra('b')) legZet('b','extra',m.legenda);
  delete m.legenda; delete m.leg; delete m.letters;   /* stond vroeger per kaart */
}
const dots=t=>t.map(x=>

/* de bolletjes horen bij het laatste woord: samen afbreken, nooit los */
function naam(it){
  const t=esc(it.n);
  if(!it.t||!it.t.length) return t;
  const i=t.lastIndexOf(' ');
  const kop=i>0?t.slice(0,i+1):'';
  const staart=i>0?t.slice(i+1):t;
  return kop+`<span class="nw">${staart}${dots(it.t)}</span>`;
}
const num=v=>Math.round(v*100)/100;
const klem=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));

/* ---------- geschiedenis ---------- */
let past=[], future=[], histTimer=null;
function snap(){ return JSON.stringify(m); }
function commit(now){
  clearTimeout(histTimer);
  const go=()=>{
    const cur=snap();
    if(past.length && past[past.length-1]===cur) return;
    past.push(cur); if(past.length>80) past.shift();
    future.length=0; refreshHist();
  };
  now?go():histTimer=setTimeout(go,450);
}
function restore(str){ m=JSON.parse(str); applyType(); drawForm(); draw(true); drawInsp(); }
function undo(){
  if(past.length<2) return;
  future.push(past.pop());
  restore(past[past.length-1]); refreshHist();
}
function redo(){
  if(!future.length) return;
  const st=future.pop(); past.push(st); restore(st); refreshHist();
}
function refreshHist(){
  $('undo').disabled=past.length<2;
  $('redo').disabled=!future.length;
}

/* standaardmaten voor blokken die je zelf toevoegt */
const LU_STD={
  h:{lb:'Kop',        l:6,    t:34, fs:29},
  s:{lb:'Ondertitel', l:6,    t:45, w:60, fs:12},
  b:{lb:'Blok',       l:3.98, t:46, w:66.5, h:60, pw:15}
};
function BASE(id){
  if(LAYOUT[id]) return LAYOUT[id];
  if(/\.deco$/.test(id))  return {lb:'Decorvlak', l:95.42, t:0, w:52.58, h:210};
  if(/\.frame$/.test(id)) return {lb:'Kader', l:5, t:5, w:138, h:200};
  const t=/^lu\.(h|s|b)\.(.+)$/.exec(id||'');
  if(!t) return {};
  const blok=(m.blokken||[]).find(x=>x.id===t[2]);
  const naam={h:'Kop ',s:'Ondertitel ',b:'Blok '}[t[1]];
  return Object.assign({}, LU_STD[t[1]], {lb:naam+((blok&&blok.kop)||t[2])});
}
function secOf(id){
  if(SECOF[id]) return SECOF[id];
  const t=/^lu\.b\.(.+)$/.exec(id||'');
  return t?t[1]:null;
}

/* geometrie van een element: gemeten waarde, eventueel overschreven */
function L(id){ return Object.assign({},BASE(id),(m.layout||{})[id]||{}); }
function geoDeco(id){
  if(m.print!=='druk') return geo(id);
  const g=L(id);
  let l=g.l, t=g.t, w=g.w, h=g.h;
  if(l<=0.1){ l-=3; w+=3; }
  if(l+w>=147.9) w+=3;
  if(t<=0.1){ t-=3; h+=3; }
  if(t+h>=209.9) h+=3;
  return `left:${l}mm;top:${t}mm;width:${w}mm;height:${h}mm;`;
}
function geo2(id){
  const g=L(id); let s=`left:${g.l}mm;top:${g.t}mm;`;
  if(g.w!=null) s+=`width:${g.w}mm;`;
  if(g.fs!=null) s+=`font-size:${g.fs}pt;`;
  return s;
}
function geo(id){
  const g=L(id); let s=`left:${g.l}mm;top:${g.t}mm;`;
  if(g.w!=null) s+=`width:${g.w}mm;`;
  if(g.h!=null) s+=`height:${g.h}mm;`;
  if(g.fs!=null) s+=`font-size:calc(${g.fs}pt * var(--hd));`;
  return s;
}
function set(id,k,v){ (m.layout[id]=m.layout[id]||{})[k]=v; }

/* een gerechtenblok */
const SECOF={'lu.blk1':'l1','lu.blk2':'l2','lu.blk3':'l3','p2.blkArr':'arrangementen','p3.blkKaz':'kazen','p3.blkCha':'charcuterie',
  'p3.blkBor':'borrel','p5.blkKou':'koud','p5.blkKla':'klassiekers','p5.blkWar':'warm',
  'p7.blkDes':'desserts'};

function block(id,list,theme,extraPad){
  const g=L(id), sec=secOf(id);
  const rows=list.map((it,i)=>{
    const selc = (selItem&&selItem.sec===sec&&selItem.idx===i)?' selitem':'';
    const nfs = it.fsN?`font-size:${it.fsN}pt;`:'';
    const dfs = it.fsD?`font-size:${it.fsD}pt;`:'';
    const dx=it.dx||0, dy=it.dy||0;
    const off = (dx||dy)?`transform:translate(${dx}mm,${dy}mm);`:'';
    const pxx=num(dx+(it.px||0)), pyy=num(dy+(it.py||0));
    const pof = (pxx||pyy)?`transform:translate(${pxx}mm,${pyy}mm);`:'';
    return `<div class="it${selc}" data-sec="${sec}" data-idx="${i}" style="${off}">`+
      `<div class="nm" style="${nfs}">${naam(it)}</div>`+
      (it.d?`<div class="ds" style="${dfs}">${nl(it.d)}</div>`:'')+`</div>`+
      `<div class="pr${selc}" data-sec="${sec}" data-idx="${i}" style="${pof}">${esc(it.p)}</div>`;
  }).join('');
  let fs='';
  if(g.gap!=null) fs+=`row-gap:${g.gap}mm;`;
  if(g.verdeel) fs+=`align-content:space-between;`;
  if(g.fs!=null) fs+=`--body:${g.fs}pt;--lead:${num(g.fs*1.2)}pt;`;
  if(g.fsN!=null) fs+=`--fsN:${g.fsN}pt;`;
  if(g.fsD!=null) fs+=`--fsD:${g.fsD}pt;`;
  if(g.fsP!=null) fs+=`--fsP:${g.fsP}pt;`;
  return `<div class="block ${theme}" data-el="${id}" style="${geo(id)}${fs}
      grid-template-columns:1fr ${g.pw}mm;padding:1.6mm 0 0 ${extraPad??(theme==='dark'?2.4:0)}mm">
      ${theme==='dark'?`<div class="pricebg" style="width:${g.pw}mm"></div>`:''}${rows}</div>`;
}

function randenTonen(){

  }
}

/* alles wat binnen 5 mm van de snijrand valt, kan bij het snijden sneuvelen */
function margesNakijken(){
  const fout=[];
  const paglijst=[...preview.children].filter(x=>x.classList&&x.classList.contains('page'));
  paglijst.forEach((pag,i)=>{
    const pr=pag.getBoundingClientRect(), k=148/pr.width;
    const pad=m.print==='druk'?3:0;
    for(const el of pag.querySelectorAll('[data-el]')){
      const id=el.dataset.el;
      if(/\.deco$/.test(id)) continue;
      const r=el.getBoundingClientRect();
      const x=(r.left-pr.left)*k-pad, y=(r.top-pr.top)*k-pad;
      const w=r.width*k, h=r.height*k;
      const over=[];
      if(x<5) over.push('links '+num(x)+'mm');
      if(y<5) over.push('boven '+num(y)+'mm');
      if(x+w>143) over.push('rechts '+num(148-(x+w))+'mm');
      if(y+h>205) over.push('onder '+num(210-(y+h))+'mm');
      if(over.length) fout.push('pag. '+(i+1)+' · '+((BASE(id)||{}).lb||id)+' — '+over.join(', '));
    }
  });
  if(!fout.length) return alert('Alles blijft netjes binnen 5 mm van de snijrand.');
  alert('Deze vlakken komen binnen 5 mm van de snijrand:' + String.fromCharCode(10,10) + fout.join(String.fromCharCode(10))
    + String.fromCharCode(10,10) + 'Dat hoeft niet fout te zijn — een decorvlak mag aflopen — maar tekst en kaderlijnen kunnen bij het snijden scheef uitvallen.');
}

function extraOpPaginas(){
  if(m.soort==='lunch') return;
  const lijst=paginas();
  for(const b of (m.blokken||[])){
    const i=lijst.findIndex(x=>x.id===(b.pagId||'p2'));
    const pag=i<0?null:preview.children[i];
    if(!pag||!pag.classList.contains('page')) continue;
    const kleur=b.thema==='light'?'ink':'burg';
    let h=`<div class='hd ${kleur}' data-el='lu.h.${b.id}' style='${geo('lu.h.'+b.id)}'>${esc(b.kop||'')}</div>`;
    if(b.sub) h+=`<div class='subk ${kleur}' data-el='lu.s.${b.id}' style='${geo2('lu.s.'+b.id)}'>${nl(b.sub)}</div>`;
    if(!b.los) h+=block('lu.b.'+b.id, m.s[b.id]||[], b.thema==='light'?'light':'dark');
    pag.insertAdjacentHTML('beforeend', h);
  }
}

function paginas(){
  if(!m.paginas){
    m.paginas=[{id:'p1',soort:'kaft'},{id:'p2',soort:'concept'},{id:'p3',soort:'kazen'},
               {id:'p4',soort:'achter1'},{id:'p5',soort:'koud'},{id:'p6',soort:'achter2'},
               {id:'p7',soort:'desserts'},{id:'p8',soort:'achter3'}];
    const naar={2:'p2',3:'p3',5:'p5',7:'p7'};
    for(const b of (m.blokken||[])) if(!b.pagId) b.pagId=naar[b.pag||2]||'p2';
  }
  if(!m.archief) m.archief=[];
  return m.paginas;
}

function tekenDiner(){
  return paginas().map((p,i)=>{
    const f=PAG[p.soort]; if(!f) return '';
    const naam=(PAGNAAM[p.soort]||p.soort);
    return f(p).replace('__TAG__', (i+1)+' · '+naam.toLowerCase());
  }).join('\n');
}

function draw(skipHist){
  if(!skipHist) commit();
  preview.innerHTML = m.soort==='lunch' ? tekenLunch() : tekenDiner();

  extraOpPaginas();
  randenTonen();
  imposeer();
  if(sel){ const el=preview.querySelector(`[data-el="${CSS.escape(sel)}"]`); if(el) mark(el); else {sel=null; drawInsp();} }
}

/* ---------- twee kaarten op een A4 ----------
   Volgorde voor dubbelzijdig printen met omslaan langs de KORTE zijde.
   Vel 1 voor: kaft + kazen · achter: achterkant + concept
   Vel 2 voor: koud + desserts · achter: achterkant + achterkant          */
const VELLEN=[[0,2],[3,1],[4,6],[7,5]];
const VELNAAM=['vel 1 · voorkant','vel 1 · achterkant','vel 2 · voorkant','vel 2 · achterkant'];

function imposeer(){
  if(m.print!=='a4') return;   /* drukwerk en los A5 blijven losse paginas */
  const ps=[...preview.children].filter(n=>n.classList.contains('page'));

  if(m.soort==='lunch'){
    if(ps.length!==1) return;
    const v=document.createElement('div'); v.className='a4';
    const kopie=ps[0].cloneNode(true);
    kopie.querySelectorAll('[data-el],[data-sec]').forEach(x=>{
      x.removeAttribute('data-el'); x.removeAttribute('data-sec'); x.classList.remove('sel','selitem'); });
    v.appendChild(ps[0]); v.appendChild(kopie);
    v.insertAdjacentHTML('beforeend',
      '<span class="snij t"></span><span class="snij b"></span>'+
      '<span class="velnaam">twee dezelfde kaarten · in het midden snijden</span>');
    preview.innerHTML=''; preview.appendChild(v);
    return;
  }

  if(ps.length<2) return;
  const groepen=[];
  for(let i=0;i<ps.length;i+=4){
    const v=[i,i+2,i+3,i+1].map(x=>x<ps.length?x:null);
    groepen.push([v[0],v[1]],[v[2],v[3]]);
  }
  const frag=document.createDocumentFragment();
  groepen.filter(g=>g[0]!=null||g[1]!=null).forEach(([a,b],i)=>{
    const v=document.createElement('div');
    v.className='a4';
    if(a!=null&&ps[a]) v.appendChild(ps[a]);
    if(b!=null&&ps[b]) v.appendChild(ps[b]);
    if(i%2===1 && m.flip!=='kort') v.classList.add('gedraaid');
    v.insertAdjacentHTML('beforeend',
      `<span class="snij t"></span><span class="snij b"></span>`+
      `<span class="velnaam">vel ${Math.floor(i/2)+1} · ${i%2?'achterkant':'voorkant'}</span>`);
    frag.appendChild(v);
  });
  preview.innerHTML=''; preview.appendChild(frag);
}

const PRINTSTAND={a5:'Print: los A5', a4:'Print: 2 op A4', druk:'Print: drukwerk'};
function applyPrint(){
  if(!PRINTSTAND[m.print]) m.print='a5';
  $('pagerule').textContent =
    m.print==='a4'   ? '@page{size:A4 landscape;margin:0}' :
    m.print==='druk' ? '@page{size:154mm 216mm;margin:0}' :
                       '@page{size:A5;margin:0}';
  document.body.classList.toggle('druk', m.print==='druk');
  const b=$('opzet');
  b.textContent = PRINTSTAND[m.print];
  b.classList.toggle('on', m.print!=='a5');
  const o=$('omslag');
  o.hidden = m.print!=='a4';
  if(!m.flip) m.flip='lang';
  o.textContent = m.flip==='kort' ? 'Omslaan: korte zijde' : 'Omslaan: lange zijde';
}
$('omslag').onclick=()=>{ m.flip = m.flip==='kort' ? 'lang' : 'kort'; applyPrint(); draw(); };
$('opzet').onclick=()=>{
  m.print = m.print==='a5' ? 'a4' : m.print==='a4' ? 'druk' : 'a5';
  applyPrint(); draw();
};

/* ---------- selectie, slepen en schalen ---------- */
function mark(el){
  preview.querySelectorAll('.sel').forEach(n=>{n.classList.remove('sel');n.querySelector(':scope>.rz')?.remove();});
  el.classList.add('sel');
  const g=L(sel);
  if(g.w!=null&&g.h!=null){ const h=document.createElement('div'); h.className='rz'; el.appendChild(h); }
}
function mmPerPx(){ const p=preview.querySelector('.page'); return 148/p.getBoundingClientRect().width; }

/* ---------- uitlijnen ---------- */
let snapOn=true;
const TOL=0.7;   /* magneetafstand in mm */

function boxOf(page,node){
  const pr=page.getBoundingClientRect(), k=148/pr.width, r=node.getBoundingClientRect();
  return {x:(r.left-pr.left)*k, y:(r.top-pr.top)*k, w:r.width*k, h:r.height*k};
}
function candidates(page,skip,metGerechten){
  const X=[0,74,148], Y=[0,105,210], edge=new Set([0,74,148,105,210]);
  const sel = metGerechten ? '[data-el],.it,.pr' : '[data-el]';
  page.querySelectorAll(sel).forEach(n=>{
    if(n===skip||n.contains(skip)) return;
    const b=boxOf(page,n);
    X.push(b.x,b.x+b.w/2,b.x+b.w);
    Y.push(b.y,b.y+b.h/2,b.y+b.h);
  });
  return {X,Y,edge};
}

/* uitleg bij een dieetbolletje, meteen zichtbaar */
let tip=null, sleept=false;
function tipToon(txt,ev){
  if(sleept) return;
  if(!tip){ tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip); }
  tip.textContent=txt; tip.hidden=false;
  tip.style.left=(ev.clientX+14)+'px'; tip.style.top=(ev.clientY+16)+'px';
}
function tipWeg(){ if(tip) tip.hidden=true; }
document.addEventListener('mouseover',e=>{
  const d=e.target.closest && e.target.closest('.dot,.tag');
  if(!d) return tipWeg();
  tipToon(d.dataset.naam||d.getAttribute('aria-label')||'', e);
});
document.addEventListener('mousemove',e=>{
  if(!tip||tip.hidden) return;
  const d=e.target.closest && e.target.closest('.dot,.tag');
  if(!d) return tipWeg();
  tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+16)+'px';
});
document.addEventListener('mouseleave',tipWeg,true);

const mmTxt=v=>(v>0?'+':'')+v.toFixed(2).replace('.',',');
function hudMaak(){ const d=document.createElement('div'); d.className='hud'; document.body.appendChild(d); return d; }
function hudZet(d,txt,ev){ d.textContent=txt; d.style.left=(ev.clientX+16)+'px'; d.style.top=(ev.clientY+18)+'px'; }
function snapAxis(pos,size,cands){
  if(!snapOn) return null;
  let best=null;
  for(const [e,off] of [[pos,0],[pos+size/2,size/2],[pos+size,size]])
    for(const c of cands){
      const d=Math.abs(e-c);
      if(d<=TOL && (!best||d<best.d)) best={d,v:c-off,line:c};
    }
  return best;
}
function showGuides(page,lines){
  page.querySelectorAll('.guide').forEach(n=>n.remove());
  for(const g of lines){
    const d=document.createElement('div');
    d.className='guide '+g.axis+(g.home?' home':(g.edge?' edge':''));
    d.style[g.axis==='v'?'left':'top']=g.at+'mm';
    page.appendChild(d);
  }
}
function clearGuides(){ preview.querySelectorAll('.guide').forEach(n=>n.remove()); }

preview.addEventListener('pointerdown',e=>{
  if(!editing) return;
  const handle=e.target.closest('.rz');
  const el=e.target.closest('[data-el]');
  const itEl=e.target.closest('.it,.pr');

  /* al geselecteerd? dan versleep je het gerecht zelf, prijs gaat mee */
  if(itEl && selItem && selItem.sec===itEl.dataset.sec && selItem.idx===+itEl.dataset.idx){
    e.preventDefault();
    const it=m.s[selItem.sec][selItem.idx];
    const alleenPrijs=e.altKey;                       /* Alt: alleen de prijs */
    const kx=alleenPrijs?'px':'dx', ky=alleenPrijs?'py':'dy';
    const k0=mmPerPx(), x0=e.clientX, y0=e.clientY;
    const s0={x:it[kx]||0, y:it[ky]||0};
    const page=itEl.closest('.page'), blok=itEl.closest('.block');
    const q=`[data-sec="${CSS.escape(itEl.dataset.sec)}"][data-idx="${itEl.dataset.idx}"]`;
    const txEl=blok.querySelector('.it'+q), prEl=blok.querySelector('.pr'+q);

    /* regelhoogte van dit gerecht, om per hele regel te kunnen verspringen */
    const nmEl=txEl.querySelector('.nm');
    const lh=parseFloat(getComputedStyle(nmEl).lineHeight)*k0 || 6.77;

    /* regelraster tekenen: elke lijn is één tekstregel */
    const bb=boxOf(page,blok), b0=boxOf(page,itEl);
    const rustY=b0.y-(it.dy||0)-bb.y, rustX=b0.x-(it.dx||0)-bb.x;
    const absX=b0.x-s0.x, absY=b0.y-s0.y;        /* plek op de pagina zonder verschuiving */
    const cand=candidates(page,itEl,true);       /* alles op deze pagina om op uit te lijnen */
    const raster=[];
    for(let r=-10;r<=20;r++){
      const y=rustY+r*lh;
      if(y<0||y>bb.h) continue;
      const d=document.createElement('div');
      d.className='rasterlijn'+(r===0?' nul':'');
      d.dataset.r=r; d.style.top=y+'mm';
      blok.appendChild(d); raster.push(d);
    }
    const vlijn=document.createElement('div');
    vlijn.className='raster-v'; vlijn.style.left=rustX+'mm'; vlijn.style.display='none';
    blok.appendChild(vlijn);

    const hud=hudMaak(); sleept=true; tipWeg();
    const zet=()=>{
      const dx=it.dx||0, dy=it.dy||0;
      txEl.style.transform=(dx||dy)?`translate(${dx}mm,${dy}mm)`:'';
      const px=num(dx+(it.px||0)), py=num(dy+(it.py||0));
      if(prEl) prEl.style.transform=(px||py)?`translate(${px}mm,${py}mm)`:'';
    };

    const mv=ev=>{
      let dx=s0.x+(ev.clientX-x0)*k0, dy=s0.y+(ev.clientY-y0)*k0;
      let regels=null; const lines=[];
      if(snapOn){
        /* zijwaarts: eerst terug naar nul, anders uitlijnen op iets anders */
        if(Math.abs(dx)<=TOL) dx=0;
        else { const sx=snapAxis(absX+dx,b0.w,cand.X);
               if(sx){ dx=num(sx.v-absX);
                       lines.push({axis:'v',at:num(sx.line),edge:cand.edge.has(num(sx.line))}); } }
        /* verticaal: eerst het regelraster, anders uitlijnen op iets anders */
        const r=Math.round(dy/lh);
        if(Math.abs(dy-r*lh)<=TOL){ dy=num(r*lh); regels=r; }
        else { const sy=snapAxis(absY+dy,b0.h,cand.Y);
               if(sy){ dy=num(sy.v-absY);
                       lines.push({axis:'h',at:num(sy.line),edge:cand.edge.has(num(sy.line))}); } }
      }
      it[kx]=num(dx); it[ky]=num(dy);
      zet();
      raster.forEach(d=>d.classList.toggle('aan', regels!==null && +d.dataset.r===regels));
      vlijn.style.display = dx===0 ? '' : 'none';
      showGuides(page,lines);
      const wat=alleenPrijs?'prijs':'gerecht';
      const reg=regels===null?'':(regels===0?'   op zijn plek':`   ${regels>0?'+':''}${regels} regel${Math.abs(regels)===1?'':'s'}`);
      hudZet(hud,`${wat}   ${mmTxt(it[kx])} · ${mmTxt(it[ky])} mm${reg}`,ev);
      fillInsp();
    };
    const up2=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up2);
      hud.remove(); raster.forEach(d=>d.remove()); vlijn.remove(); clearGuides(); sleept=false;
      draw(true); commit(); drawInsp(); };
    addEventListener('pointermove',mv); addEventListener('pointerup',up2);
    return;
  }

  let moved=false;
  const watch=ev=>{ if(Math.abs(ev.clientX-e.clientX)>2||Math.abs(ev.clientY-e.clientY)>2) moved=true; };
  const settle=()=>{
    removeEventListener('pointermove',watch); removeEventListener('pointerup',settle);
    if(!moved && itEl && itEl.dataset.sec){
      sel=null; selItem={sec:itEl.dataset.sec, idx:+itEl.dataset.idx};
      draw(true); drawInsp();
    }
  };
  addEventListener('pointermove',watch); addEventListener('pointerup',settle);
  if(!el){ sel=null; selItem=null; preview.querySelectorAll('.sel').forEach(n=>n.classList.remove('sel')); return drawInsp(); }
  e.preventDefault();
  if(sel!==el.dataset.el){ sel=el.dataset.el; selItem=null; mark(el); drawInsp(); }
  const id=sel, g=L(id), k=mmPerPx();
  const x0=e.clientX, y0=e.clientY;
  const s0={l:g.l,t:g.t,w:g.w,h:g.h};
  const mode=handle?'size':'move';
  const page=el.closest('.page');
  const cand=candidates(page,el);
  const b0=boxOf(page,el);
  const hud=hudMaak();
  const move=ev=>{
    const dx=(ev.clientX-x0)*k, dy=(ev.clientY-y0)*k, lines=[];
    if(mode==='move'){
      let L2=klem(s0.l+dx, -b0.w+8, 148-8), T2=klem(s0.t+dy, -b0.h+8, 210-8);
      const sx=snapAxis(L2,b0.w,cand.X), sy=snapAxis(T2,b0.h,cand.Y);
      if(sx){ L2=sx.v; lines.push({axis:'v',at:num(sx.line),edge:cand.edge.has(num(sx.line))}); }
      if(sy){ T2=sy.v; lines.push({axis:'h',at:num(sy.line),edge:cand.edge.has(num(sy.line))}); }
      set(id,'l',num(L2)); set(id,'t',num(T2));
      el.style.left=L(id).l+'mm'; el.style.top=L(id).t+'mm';
    }else{
      let W2=klem(s0.w+dx,4,200), H2=klem(s0.h+dy,3,260);
      if(snapOn){
        for(const c of cand.X) if(Math.abs(s0.l+W2-c)<=TOL){ W2=c-s0.l; lines.push({axis:'v',at:num(c),edge:cand.edge.has(num(c))}); break; }
        for(const c of cand.Y) if(Math.abs(s0.t+H2-c)<=TOL){ H2=c-s0.t; lines.push({axis:'h',at:num(c),edge:cand.edge.has(num(c))}); break; }
      }
      set(id,'w',num(W2)); set(id,'h',num(H2));
      el.style.width=L(id).w+'mm'; el.style.height=L(id).h+'mm';
    }
    showGuides(page,lines);
    const g=L(id);
    hudZet(hud, mode==='move' ? `X ${g.l} · Y ${g.t} mm` : `${g.w} × ${g.h} mm`, ev);
    fillInsp();
  };
  const up=()=>{ removeEventListener('pointermove',move); removeEventListener('pointerup',up);
    hud.remove(); clearGuides(); draw(); };
  addEventListener('pointermove',move); addEventListener('pointerup',up);
});

addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); return e.shiftKey?redo():undo(); }
  if(!editing||/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if(e.key==='Escape'){ sel=null; selItem=null; draw(true); return drawInsp(); }
  const d={ArrowLeft:['dx','l',-1],ArrowRight:['dx','l',1],
           ArrowUp:['dy','t',-1],ArrowDown:['dy','t',1]}[e.key];
  if(!d) return;
  const stap=d[2]*(e.shiftKey?1:.25);
  if(selItem){
    e.preventDefault();
    const it=m.s[selItem.sec][selItem.idx];
    it[d[0]]=num((it[d[0]]||0)+stap);
    draw(true); commit(); fillInsp();
    return;
  }
  if(!sel) return;
  e.preventDefault();
  set(sel,d[1],num(L(sel)[d[1]]+stap));
  draw(); fillInsp();
});

/* ---------- inspecteur ---------- */
const FIELDS=[['l','X'],['t','Y'],['w','Breedte'],['h','Hoogte'],['pw','Prijskolom'],['fs','Korps (pt)']];
const TYPEFLD=[['fsN','Titel (pt)'],['fsD','Omschrijving (pt)'],['fsP','Prijs (pt)']];

function blokVelden(g){
  return `<div class='fld'><label for='f_gap'>Regelafstand</label>`+
    `<input id='f_gap' type='number' step='0.25' data-k='gap' value='${g.gap??''}' placeholder='auto'></div>`+
    `<div class='fld'><label>&nbsp;</label>`+
    `<button class='mini' data-blokverdeel='1'>${g.verdeel?'Gelijk verdeeld':'Van boven af'}</button></div>`+
    `<div class='fld wide'><button class='mini' data-blokrecht='1'>Verschuivingen in dit blok wissen</button></div>`;
}

function drawInsp(){
  if(!editing || (!sel&&!selItem)){ insp.hidden=true; return; }
  insp.hidden=false;
  if(selItem) return inspItem();
  $('iName').textContent=L(sel).lb||sel;
  $('iSub').textContent='pagina '+sel.slice(1,2)+' · '+sel;
  const g=L(sel);
  const bas=BASE(sel);
  let h=FIELDS.filter(([k])=>bas[k]!=null)
    .map(([k,lab])=>`<div class="fld"><label for="f_${k}">${lab}</label>
      <input id="f_${k}" type="number" step="0.25" data-k="${k}" value="${g[k]}"></div>`).join('');
  if(secOf(sel)) h+=blokVelden(g)+TYPEFLD.map(([k,lab])=>`<div class="fld"><label for="f_${k}">${lab}</label>
      <input id="f_${k}" type="number" step="0.5" data-k="${k}" value="${g[k]??''}"
      placeholder="${m.type.body}"></div>`).join('');
  $('iFields').innerHTML=h;
  $('iReset').textContent='Origineel';
}

function inspItem(){
  const it=m.s[selItem.sec][selItem.idx];
  $('iName').textContent=it.n||'Gerecht';
  $('iSub').textContent=selItem.sec+' · nr '+(selItem.idx+1);
  $('iFields').innerHTML=`
    <div class="fld wide"><label for="i_n">Naam</label><input id="i_n" data-i="n" value="${esc(it.n)}"></div>
    <div class="fld wide"><label for="i_d">Omschrijving</label><textarea id="i_d" data-i="d">${esc(it.d)}</textarea></div>
    <div class="fld"><label for="i_p">Prijs</label><input id="i_p" data-i="p" value="${esc(it.p)}"></div>
    <div class="fld"><label for="i_t">Titel (pt)</label><input id="i_t" type="number" step="0.5" data-i="fsN"
        value="${it.fsN??''}" placeholder="${m.type.nm}"></div>
    <div class="fld"><label for="i_o">Omschrijving (pt)</label><input id="i_o" type="number" step="0.5" data-i="fsD"
        value="${it.fsD??''}" placeholder="${m.type.ds}"></div>
    <div class="fld"><label for="i_x">Verschuif X</label><input id="i_x" type="number" step="0.25" data-i="dx" value="${it.dx??0}"></div>
    <div class="fld"><label for="i_y">Verschuif Y</label><input id="i_y" type="number" step="0.25" data-i="dy" value="${it.dy??0}"></div>
    <div class="fld"><label for="i_px">Prijs apart X</label><input id="i_px" type="number" step="0.25" data-i="px" value="${it.px??0}"></div>
    <div class="fld"><label for="i_py">Prijs apart Y</label><input id="i_py" type="number" step="0.25" data-i="py" value="${it.py??0}"></div>
    <div class="fld"><label>Dieet</label><div class="tags">${Object.keys(TAGS).map(t=>
      `<button class="tag ${it.t.includes(t)?'on':''}" data-it="${t}"
        style="background:${legKleur(t)};color:${contrast(legKleur(t))}"
        aria-label="${esc(legLabel(t))}" data-naam="${esc(legLabel(t))}">${LET[t]}</button>`).join('')}</div></div>`;
  $('iReset').textContent='Terugzetten';
}
function fillInsp(){
  if(insp.hidden) return;
  const g=L(sel);
  $('iFields').querySelectorAll('input').forEach(i=>{ if(document.activeElement!==i) i.value=g[i.dataset.k]; });
}
$('iFields').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.i!==undefined && selItem){
    const it=m.s[selItem.sec][selItem.idx], k=t.dataset.i;
    if(['fsN','fsD','dx','dy','px','py'].includes(k)){
      const v=parseFloat(t.value);
      if(t.value==='') delete it[k]; else if(!isNaN(v)) it[k]=v;
    }
    else it[k]=t.value;
    draw(true); commit(); drawForm();
    return;
  }
  if(!sel) return;
  const k=t.dataset.k;
  if(t.value===''){ delete (m.layout[sel]||{})[k]; return draw(); }
  const v=parseFloat(t.value); if(isNaN(v)) return;
  const grens={l:[-200,300], t:[-260,400], w:[2,300], h:[2,400],
               pw:[2,120], fs:[4,120], fsN:[4,120], fsD:[4,120], fsP:[4,120],
               gap:[0,60]}[k];
  set(sel, k, grens ? klem(v,grens[0],grens[1]) : v);
  draw();
});
$('iFields').addEventListener('click',e=>{
  const vd=e.target.closest('[data-blokverdeel]');
  if(vd && sel){ set(sel,'verdeel', L(sel).verdeel?0:1); draw(); return drawInsp(); }
  const rc=e.target.closest('[data-blokrecht]');
  if(rc && sel){
    const sec=secOf(sel);
    if(sec) (m.s[sec]||[]).forEach(it=>{ delete it.dx; delete it.dy; delete it.px; delete it.py; });
    draw(); return drawInsp();
  }
  const b=e.target.closest('[data-it]'); if(!b||!selItem) return;
  const a=m.s[selItem.sec][selItem.idx].t, t=b.dataset.it;
  a.includes(t)?a.splice(a.indexOf(t),1):a.push(t);
  draw(); drawInsp(); drawForm();
});
$('iReset').onclick=()=>{
  if(selItem){ const it=m.s[selItem.sec][selItem.idx];
    for(const k of ['fsN','fsD','dx','dy','px','py']) delete it[k]; }
  else if(sel){ delete m.layout[sel]; }
  draw(); drawInsp();
};
$('iClose').onclick=()=>{ sel=null; selItem=null; draw(true); drawInsp(); };

$('snap').onclick=e=>{ snapOn=!snapOn; e.target.classList.toggle('on',snapOn); };
$('randen').onclick=e=>{ m.randen=!m.randen; e.target.classList.toggle('on',!!m.randen); draw(true); };
$('check').onclick=margesNakijken;
$('veilig').onclick=()=>{
  const nl2=String.fromCharCode(10);
  if(!confirm('Alle vlakken binnen 5 mm van de snijrand halen?'+nl2+nl2+'Decorvlakken blijven aflopen.')) return;
  let aantal=0;
  for(const pag of preview.children){
    if(!pag.classList||!pag.classList.contains('page')) continue;
    for(const el of pag.querySelectorAll('[data-el]')){
      const id=el.dataset.el;
      if(/\.deco$/.test(id)) continue;
      const voor=JSON.stringify(L(id));
      const g=L(id);
      if(g.l!=null && g.l<5) set(id,'l',5);
      if(g.t!=null && g.t<5) set(id,'t',5);
      const g2=L(id);
      if(g2.w!=null && g2.l+g2.w>143) set(id,'w',num(143-g2.l));
      if(g2.h!=null && g2.t+g2.h>205) set(id,'h',num(205-g2.t));
      if(JSON.stringify(L(id))!==voor) aantal++;
    }
  }
  draw(); drawInsp();
  say(aantal?('Verschoven: '+aantal+' vlak'+(aantal>1?'ken':'')):'Alles stond al goed','ok');
};

$('edit').onclick=e=>{
  editing=!editing;
  e.target.classList.toggle('on',editing);
  e.target.textContent=editing?'Klaar met indeling':'Indeling bewerken';
  document.body.classList.toggle('editing',editing);
  if(!editing){ sel=null; selItem=null; draw(true); }
  drawInsp();
};

/* ---------- formulier ---------- */
function secties(){
  const eigen=(m.blokken||[]).filter(b=>!b.los);
  if(m.soort==='lunch')
    return eigen.map((b,i)=>[b.id, b.kop||('Blok '+(i+1))]);
  return SECTIONS.concat(eigen.map((b,i)=>
    [b.id, (b.kop||('Blok '+(i+1)))+' — pag. '+(b.pag||2)]));
}

function paginaSectie(){
  if(m.soort==='lunch') return '';
  const lijst=paginas(), arch=m.archief||[];
  return `<div class='sec'><header><h2>Pagina's</h2>
    <span class='count'>${lijst.length}</span>
    <button class='mini' id='pagErbij'>+ Lege pagina</button></header>
    ${lijst.map((p,i)=>`<div class='row'><div class='l1'>
      <span class='pagnr'>${i+1}</span>
      <span class='pagnaam'>${PAGNAAM[p.soort]||p.soort}</span>
      <div class='rowtools'>
        <button class='mini ghost' data-pagop='${p.id}' title='Omhoog'>↑</button>
        <button class='mini ghost' data-pagneer='${p.id}' title='Omlaag'>↓</button>
        ${p.soort==='leeg'?`<button class='mini ghost' data-pagkopie='${p.id}' title='Dupliceren'>⧉</button>`:''}
        <button class='mini ghost' data-pagweg='${p.id}' title='Naar archief'>✕</button>
      </div></div></div>`).join('')}
    ${arch.length?`<p class='hint'>Archief — klik om terug te halen.</p>
      ${arch.map(p=>`<div class='row'><div class='l1'>
        <span class='pagnaam'>${PAGNAAM[p.soort]||p.soort}</span>
        <div class='rowtools'>
          <button class='mini ghost' data-pagterug='${p.id}' title='Terughalen'>↩</button>
          <button class='mini ghost' data-pagweggooi='${p.id}' title='Definitief weg'>✕</button>
        </div></div></div>`).join('')}`:''}
  </div>`;
}

function extraSectie(){
  if(m.soort==='lunch') return '';
  const lijst=m.blokken||[];
  return `<div class='sec'><header><h2>Losse koppen en blokken</h2>
    <span class='count'>${lijst.length}</span>
    <button class='mini' id='kopErbij'>+ Losse kop</button>
    <button class='mini' id='blokErbij'>+ Blok</button></header>
    <p class='hint'>Kies op welke pagina het komt te staan. Slepen doe je met Indeling bewerken aan.</p>
    ${lijst.map(b=>`<div class='row'>
      <div class='l1'>
        <input data-blokkop='${b.id}' value='${esc(b.kop||'')}' placeholder='Kop'>
        <select data-blokpag='${b.id}'>${paginas().map((p,i)=>
          `<option value='${p.id}'${(b.pagId||'p2')===p.id?' selected':''}>${i+1}. ${PAGNAAM[p.soort]||p.soort}</option>`).join('')}</select>
        <button class='mini ghost' data-blokthema='${b.id}' title='Donker of licht'>${b.thema==='light'?'licht':'donker'}</button>
        <button class='mini ghost' data-blokweg='${b.id}' title='Verwijderen'>✕</button>
      </div>
      <input data-bloksub='${b.id}' value='${esc(b.sub||'')}' placeholder='Ondertitel (optioneel)'>
    </div>`).join('')}</div>`;
}

function drawForm(){
  let h='';
  if(m.soort==='lunch'){
    h+=`<div class="sec"><header><h2>Blokken</h2>
        <span class="count">${(m.blokken||[]).length}</span>
        <button class="mini" id="blokErbij">+ Blok</button><button class='mini' id='kopErbij'>+ Losse kop</button></header>
      <p class="hint">Zet "Indeling bewerken" aan om vlakken te verslepen. Pijltjes verplaatsen met 0,25 mm, met Shift 1 mm.</p>
      <div class="row">
        <div class="l1"><input data-kop="titel" value="${esc(kop('titel'))}" placeholder="Titel bovenaan"></div>
        <input data-kop="titelsub" value="${esc(kop('titelsub'))}" placeholder="Ondertitel (optioneel)"></div>
      ${(m.blokken||[]).map(b=>`<div class="row">
        <div class="l1">
          <input data-blokkop="${b.id}" value="${esc(b.kop||'')}" placeholder="Kop van dit blok">
          <button class="mini ghost" data-blokthema="${b.id}" title="Donker of licht vlak">${b.thema==='light'?'licht':'donker'}</button>
          <button class="mini ghost" data-blokweg="${b.id}" title="Blok verwijderen">✕</button>
        </div>
        <input data-bloksub="${b.id}" value="${esc(b.sub||'')}" placeholder="Ondertitel (optioneel)">
      </div>`).join('')}
    </div>`;
  } else {
    h+=`<div class="sec"><header><h2>Het concept — pagina 2</h2></header>
      <p class="hint">Zet "Indeling bewerken" aan om vlakken te verslepen. Pijltjes verplaatsen met 0,25 mm, met Shift 1 mm.</p>
      <textarea class="big" data-text="concept">${esc(m.concept)}</textarea></div>`;
  }
  h+=paginaSectie();
  h+=extraSectie();
  for(const [id,label] of secties()){
    h+=`<div class="sec"><header><h2 id="sec-${id}">${label}</h2><span class="count">${m.s[id].length}</span>
        <button class="mini" data-add="${id}">+ Gerecht</button></header>`;
    m.s[id].forEach((it,i)=>{
      h+=`<div class="row" draggable="true" data-s="${id}" data-i="${i}">
        <div class="l1">
          <span class="grab" title="Sleep om te ordenen">⠿</span>
          <input data-f="n" data-s="${id}" data-i="${i}" value="${esc(it.n)}" placeholder="Naam gerecht">
          <input class="price" data-f="p" data-s="${id}" data-i="${i}" value="${esc(it.p)}" placeholder="0,00">
        </div>
        <textarea data-f="d" data-s="${id}" data-i="${i}" placeholder="Omschrijving">${esc(it.d)}</textarea>
        <div class="l2"><span class="dieet">${it.t.length?it.t.map(x=>legLabel(x)).join(' · '):'geen dieetwens'}</span>
          <div class="tags">${Object.keys(TAGS).map(t=>
          `<button class="tag ${it.t.includes(t)?'on':''}" data-t="${t}" data-s="${id}" data-i="${i}"
             style="background:${legKleur(t)};color:${contrast(legKleur(t))}"
             aria-label="${esc(legLabel(t))}" data-naam="${esc(legLabel(t))}">${LET[t]}</button>`).join('')}</div>
          <div class="rowtools">
            <button class="mini ghost" data-mv="-1" data-s="${id}" data-i="${i}" title="Omhoog">↑</button>
            <button class="mini ghost" data-mv="1" data-s="${id}" data-i="${i}" title="Omlaag">↓</button>
            <button class="mini ghost" data-dup="1" data-s="${id}" data-i="${i}" title="Dupliceren">⧉</button>
            <button class="mini ghost" data-del="1" data-s="${id}" data-i="${i}" title="Verwijderen">✕</button>
          </div></div>
        <div class="l2"><select data-mvsec data-s="${id}" data-i="${i}" aria-label="Verplaats naar andere sectie">
          <option value="">Verplaats naar…</option>
          ${SECTIONS.filter(([o])=>o!==id).map(([o,ol])=>`<option value="${o}">${ol}</option>`).join('')}
        </select></div></div>`;
    });
    h+=`</div>`;
  }
  if(m.soort!=='lunch')
    h+=`<div class="sec"><header><h2>Wist je dat? — pagina 7</h2></header>
      <textarea class="big" data-text="wist">${esc(m.wist)}</textarea></div>`;
  h+=`<div class="sec"><header><h2>Dieetbolletjes</h2></header>
      <p class="hint">Naam, kleur en toelichting per bolletje. Dit geldt voor al je kaarten tegelijk.${
        m.soort==='lunch'?' De toelichting verschijnt alleen op de legenda van de dinerkaart.':''}</p>
      ${Object.keys(TAGS).map(k=>`<div class="row">
        <div class="l1">
          <input class="kleur" type="color" data-legkleur="${k}" value="${legKleur(k)}" aria-label="Kleur">
          <input data-leglabel="${k}" value="${esc(legLabel(k))}" placeholder="Naam">
          <button class="mini ghost" data-legterug="${k}" title="Terug naar standaard">↺</button>
        </div>
        <input data-legextra="${k}" value="${esc(legExtra(k))}" placeholder="Toelichting, bv. 1,50 extra">
      </div>`).join('')}</div>`;
  h+=`<div class="sec"><header><h2>Weergave</h2></header>
      <p class="hint">Letters in de bolletjes helpen ook je gasten: V vegetarisch, G glutenvrij, L lactosevrij.</p>
      <button class="mini" id="letters">Letters in bolletjes: ${INST.letters?'aan':'uit'}</button>
      <button class="mini" id="resetAll">Alle vlakken terug naar de originele maatvoering</button></div>`;
  form.innerHTML=h;
}

form.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.blokpag!==undefined){
    const blok=(m.blokken||[]).find(x=>x.id===t.dataset.blokpag);
    if(blok) blok.pagId=t.value;
    drawForm(); return draw();
  }
  if(t.dataset.legkleur!==undefined){ drawForm(); return draw(); }
  if(t.dataset.mvsec!==undefined && t.value){
    const from=t.dataset.s, i=+t.dataset.i, to=t.value;
    m.s[to].push(m.s[from].splice(i,1)[0]);
    selItem=null; drawForm(); draw();
  }
});

form.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.legkleur!==undefined){ legZet(t.dataset.legkleur,'kleur',t.value); return draw(); }
  if(t.dataset.leglabel!==undefined){ legZet(t.dataset.leglabel,'label',t.value); return draw(); }
  if(t.dataset.legextra!==undefined){ legZet(t.dataset.legextra,'extra',t.value); return draw(); }
  if(t.dataset.kop!==undefined){
    const k=t.dataset.kop, eerste=!kop(k);
    (m.koppen=m.koppen||{})[k]=t.value;
    if(k==='titelsub' && eerste && t.value && !(m.layout||{})['lu.subT']){
      const h=L('lu.hdT');
      (m.layout=m.layout||{})['lu.subT']={l:h.l-2.4, t:num(h.t+17), w:80, fs:13};
    }
    return draw();
  }
  if(t.dataset.bloksub!==undefined){
    const id=t.dataset.bloksub;
    const blok=(m.blokken||[]).find(x=>x.id===id);
    if(!blok) return;
    const eerste=!blok.sub;
    blok.sub=t.value;
    if(eerste && t.value){
      const h=L('lu.h.'+id);
      (m.layout=m.layout||{})['lu.s.'+id]={l:h.l, t:num(h.t+11), w:60, fs:12};
    }
    return draw();
  }
  if(t.dataset.blokkop!==undefined){
    const id=t.dataset.blokkop;
    const blok=(m.blokken||[]).find(x=>x.id===id);
    if(blok) blok.kop=t.value;
    const h2=document.getElementById('sec-'+id);          /* kop meteen bijwerken */
    if(h2) h2.textContent=t.value||('Blok '+((m.blokken||[]).indexOf(blok)+1));
    if(sel==='lu.h.'+id||sel==='lu.b.'+id) drawInsp();
    return draw();
  }
  if(t.dataset.text){ m[t.dataset.text]=t.value; return draw(); }
  if(t.dataset.f){ m.s[t.dataset.s][+t.dataset.i][t.dataset.f]=t.value; draw(); }
});
form.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='resetAll'){ m.layout={}; return draw(); }
  if(b.id==='letters'){ INST.letters=!INST.letters; instBewaar(); drawForm(); return draw(); }
  if(b.dataset.legterug){ delete INST.leg[b.dataset.legterug]; instBewaar(); drawForm(); return draw(); }

  if(b.id==='pagErbij'){
    const id='x'+Date.now().toString(36);
    paginas().push({id,soort:'leeg'});
    drawForm(); return draw();
  }
  if(b.dataset.pagop || b.dataset.pagneer){
    const id=b.dataset.pagop||b.dataset.pagneer, L=paginas();
    const i=L.findIndex(p=>p.id===id), j=i+(b.dataset.pagop?-1:1);
    if(i<0||j<0||j>=L.length) return;
    [L[i],L[j]]=[L[j],L[i]];
    drawForm(); return draw();
  }
  if(b.dataset.pagweg){
    const L=paginas(), i=L.findIndex(p=>p.id===b.dataset.pagweg);
    if(i<0) return;
    m.archief.push(L.splice(i,1)[0]);
    drawForm(); return draw();
  }
  if(b.dataset.pagterug){
    const i=(m.archief||[]).findIndex(p=>p.id===b.dataset.pagterug);
    if(i<0) return;
    paginas().push(m.archief.splice(i,1)[0]);
    drawForm(); return draw();
  }
  if(b.dataset.pagweggooi){
    if(!confirm('Deze pagina definitief verwijderen? Losse koppen en blokken die erop staan gaan mee.')) return;
    const id=b.dataset.pagweggooi;
    m.archief=(m.archief||[]).filter(p=>p.id!==id);
    (m.blokken||[]).filter(x=>x.pagId===id).forEach(x=>{
      delete m.s[x.id];
      for(const k of ['lu.h.','lu.s.','lu.b.']) delete (m.layout||{})[k+x.id];
    });
    m.blokken=(m.blokken||[]).filter(x=>x.pagId!==id);
    for(const k of Object.keys(m.layout||{})) if(k.startsWith(id+'.')) delete m.layout[k];
    drawForm(); return draw();
  }
  if(b.dataset.pagkopie){
    const L=paginas(), oud=L.find(p=>p.id===b.dataset.pagkopie);
    if(!oud) return;
    const nieuwId='x'+Date.now().toString(36);
    L.splice(L.indexOf(oud)+1, 0, {id:nieuwId, soort:oud.soort});
    m.layout=m.layout||{};
    for(const k of Object.keys(m.layout))
      if(k.startsWith(oud.id+'.')) m.layout[nieuwId+k.slice(oud.id.length)]=structuredClone(m.layout[k]);
    (m.blokken||[]).filter(x=>x.pagId===oud.id).forEach((x,t)=>{
      const nid=(x.los?'k':'b')+Date.now().toString(36)+t;
      m.blokken.push(Object.assign(structuredClone(x), {id:nid, pagId:nieuwId}));
      if(!x.los) m.s[nid]=structuredClone(m.s[x.id]||[]);
      for(const k of ['lu.h.','lu.s.','lu.b.'])
        if(m.layout[k+x.id]) m.layout[k+nid]=structuredClone(m.layout[k+x.id]);
    });
    drawForm(); return draw();
  }
  if(b.id==='kopErbij'){
    const id='k'+Date.now().toString(36);
    const aantal=(m.blokken=m.blokken||[]).length;
    m.blokken.push({id,kop:'NIEUWE KOP',sub:'',thema:'dark',los:1,pagId:paginas()[1]?paginas()[1].id:'p2'});
    m.layout=m.layout||{};
    m.layout['lu.h.'+id]={l:klem(6+aantal*4,4,120), t:klem(34+aantal*8,8,190)};
    drawForm(); return draw();
  }
  if(b.id==='blokErbij'){
    const id='b'+Date.now().toString(36);
    const n=(m.blokken=m.blokken||[]).length;
    m.blokken.push({id,kop:'NIEUWE KOP',thema:'dark',pagId:paginas()[1]?paginas()[1].id:'p2'});
    m.s[id]=[{n:'Nieuw gerecht',d:'',p:'0',t:[]}];
    m.layout=m.layout||{};
    m.layout['lu.h.'+id]={l:klem(6+n*4,4,120),  t:klem(34+n*8,8,190)};
    m.layout['lu.b.'+id]={l:klem(3.98+n*4,2,120), t:klem(46+n*8,10,195), w:66.5, h:50, pw:15};
    drawForm(); return draw();
  }
  if(b.dataset.blokweg){
    const id=b.dataset.blokweg;
    m.blokken=m.blokken.filter(x=>x.id!==id);
    delete m.s[id];
    delete (m.layout||{})['lu.h.'+id]; delete (m.layout||{})['lu.b.'+id];
    if(selItem&&selItem.sec===id) selItem=null;
    drawForm(); return draw();
  }
  if(b.dataset.blokthema){
    const blok=m.blokken.find(x=>x.id===b.dataset.blokthema);
    blok.thema = blok.thema==='light'?'dark':'light';
    drawForm(); return draw();
  }
  const s=b.dataset.s, i=+b.dataset.i;
  if(b.dataset.add) m.s[b.dataset.add].push({n:'Nieuw gerecht',d:'',p:'0',t:[]});
  else if(b.dataset.del) m.s[s].splice(i,1);
  else if(b.dataset.dup) m.s[s].splice(i+1,0,structuredClone(m.s[s][i]));
  else if(b.dataset.mv){ const j=i+(+b.dataset.mv); if(j<0||j>=m.s[s].length) return;
    [m.s[s][i],m.s[s][j]]=[m.s[s][j],m.s[s][i]]; }
  else if(b.dataset.t){ const a=m.s[s][i].t,t=b.dataset.t;
    a.includes(t)?a.splice(a.indexOf(t),1):a.push(t); }
  else return;
  drawForm(); draw();
});

/* ---------- gerechten slepen om te ordenen ---------- */
let dragFrom=null;
form.addEventListener('dragstart',e=>{
  const r=e.target.closest('.row'); if(!r) return;
  dragFrom={s:r.dataset.s, i:+r.dataset.i};
  r.classList.add('drag'); e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain',''); }catch{}
});
form.addEventListener('dragend',()=>{
  dragFrom=null;
  form.querySelectorAll('.drag,.over').forEach(n=>n.classList.remove('drag','over'));
});
form.addEventListener('dragover',e=>{
  const r=e.target.closest('.row'); if(!r||!dragFrom) return;
  e.preventDefault();
  form.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));
  r.classList.add('over');
});
form.addEventListener('drop',e=>{
  const r=e.target.closest('.row'); if(!r||!dragFrom) return;
  e.preventDefault();
  const to={s:r.dataset.s, i:+r.dataset.i};
  const it=m.s[dragFrom.s].splice(dragFrom.i,1)[0];
  let j=to.i;
  if(dragFrom.s===to.s && dragFrom.i<to.i) j--;
  m.s[to.s].splice(j,0,it);
  dragFrom=null; selItem=null; drawForm(); draw();
});

/* ---------- korps en zoom ---------- */
function opruimenLayout(){
  /* vlakken die ooit buiten de pagina zijn beland halen de printer omlaag */
  for(const [k,g] of Object.entries(m.layout||{})){
    if(g.l!=null) g.l=klem(g.l,-60,148);
    if(g.t!=null) g.t=klem(g.t,-60,210);
    if(g.w!=null) g.w=klem(g.w,2,200);
    if(g.h!=null) g.h=klem(g.h,2,260);
  }
}

function applyType(){
  migreerLunch(); migreerLegenda(); opruimenLayout();
  if(m.soort!=='lunch') paginas();
  if(!m.type) m.type={};
  const t=m.type;
  if(t.body==null) t.body=16;
  if(t.nm==null) t.nm=t.body;      /* oudere bestanden volgen de kadertekst */
  if(t.ds==null) t.ds=t.body;
  if(t.hd==null) t.hd=1;
  if(!m.layout) m.layout={};
  if(m.zoom==null) m.zoom=.85;
  const kn=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
  t.body=kn(t.body,8,24); t.nm=kn(t.nm,8,28); t.ds=kn(t.ds,7,24);
  t.hd=kn(t.hd,.4,1.6); m.zoom=kn(m.zoom,.3,1.6);
  const r=document.documentElement.style;
  r.setProperty('--body',t.body+'pt');
  r.setProperty('--lead',num(t.ds*1.2)+'pt');
  r.setProperty('--fsN',t.nm+'pt');
  r.setProperty('--fsD',t.ds+'pt');
  r.setProperty('--hd',t.hd.toFixed(2));
  preview.style.zoom=m.zoom;
  applyPrint();
  const toon=v=>v.toFixed(v%1?1:0);
  $('szBody').textContent=toon(t.body);
  $('szNm').textContent=toon(t.nm);
  $('szDs').textContent=toon(t.ds);
  $('szHd').textContent=Math.round(t.hd*100)+'%';
  $('szZoom').textContent=Math.round(m.zoom*100)+'%';
}
document.querySelector('.bar').addEventListener('click',e=>{
  const b=e.target.closest('[data-sz],[data-zm]'); if(!b) return;
  if(b.dataset.zm) m.zoom+=parseFloat(b.dataset.zm);
  else m.type[b.dataset.sz]+=parseFloat(b.dataset.d);
  applyType();
});

$('undo').onclick=undo;
$('redo').onclick=redo;

/* de zoom van het scherm mag nooit in de print terechtkomen, ook niet bij Cmd+P */
/* PDF laten maken door de browser buiten beeld: geen printvenster, geen schaling */
$('pdf').onclick=async()=>{
  if(!SERVED){
    say('PDF maken kan alleen via de server','err');
    return;
  }
  say('Eerst bewaren…','busy');

  await push();

    const r=await fetch('/api/pdf',{method:'POST',headers:{'Content-Type':'application/json'},

    say('PDF klaar: '+d.pad,'ok');

addEventListener('beforeprint',()=>{ preview.style.zoom=1; });
addEventListener('afterprint',()=>{ preview.style.zoom=m.zoom; });
$('print').onclick=()=>{ preview.style.zoom=1; setTimeout(()=>{ window.print(); preview.style.zoom=m.zoom; },60); };
$('save').onclick=()=>{
  const d=new Date(), st=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(m,null,2)],{type:'application/json'}));
  a.download=`tafelaar-menu-${st}.json`; a.click(); URL.revokeObjectURL(a.href);
};
$('load').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ m=JSON.parse(await f.text()); applyType(); drawForm(); draw(); }
  catch{ alert('Dit bestand kon niet gelezen worden. Kies een bestand dat met "Bewaar" is gemaakt.'); }
  e.target.value='';
};

/* ---------- automatisch bewaren (alleen als het via de server draait) ---------- */
const SERVED = location.protocol.startsWith('http');
let kaart = new URLSearchParams(location.search).get('kaart')
         || localStorage.getItem('tafelaar-kaart') || 'diner';
const status=$('status');
let saveTimer=null, lastSaved='';

function say(txt,cls){ status.hidden=false; status.textContent=txt; status.className='status '+(cls||''); }

async function pull(){
  if(!SERVED) return;
  try{
    const r=await fetch('/api/menu?kaart='+encodeURIComponent(kaart));
    if(!r.ok) throw 0;
    const d=await r.json();
    if(d && d.s){ m=d; lastSaved=JSON.stringify(m); }
    say('Geladen','ok');
    return;
  }catch{}
  const kopie=localStorage.getItem('tafelaar-kopie-'+kaart);
  if(kopie){
    try{
      const d=JSON.parse(kopie);
      if(d && d.s && confirm('De server gaf niets terug voor "'+kaart+'".\n\n'
        +'Er staat wel een kopie in deze browser. Die terugzetten?')){
        m=d; lastSaved=''; say('Kopie uit de browser teruggezet','ok'); return;
      }
    }catch{}
  }
  say('Nieuw document','ok');
}
async function push(){
  if(!SERVED) return;
  const body=JSON.stringify(m);
  if(body===lastSaved) return;
  say('Bewaren…','busy');
  try{
    const r=await fetch('/api/menu?kaart='+encodeURIComponent(kaart),
      {method:'POST',headers:{'Content-Type':'application/json'},body});
    if(!r.ok) throw 0;
    lastSaved=body;
    spiegel();
    say('Bewaard om '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),'ok');
  }catch{
    spiegel();
    say('Bewaren mislukt — kopie staat in de browser','err');
  }
}
function autosave(){
  if(!SERVED) return;
  if(JSON.stringify(m)!==lastSaved) say('Nog niet bewaard','busy');
  clearTimeout(saveTimer); saveTimer=setTimeout(push,700);
}

/* elke wijziging in het model plant een bewaaractie */
const _draw=draw;
draw=function(){ _draw.apply(this,arguments); autosave(); };
function spiegel(){                       /* vangnet in de browser zelf */
  try{ localStorage.setItem('tafelaar-kopie-'+kaart, JSON.stringify(m)); }catch{}
}
function bijSluiten(){
  const b=JSON.stringify(m);
  if(b===lastSaved) return;
  spiegel();
  if(SERVED) navigator.sendBeacon('/api/menu?kaart='+encodeURIComponent(kaart),
    new Blob([b],{type:'application/json'}));
}
addEventListener('beforeunload', bijSluiten);
addEventListener('pagehide', bijSluiten);

/* wegklikken naar een ander venster of tabblad: eerst even wegschrijven */
addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ clearTimeout(saveTimer); push(); } });
addEventListener('blur',()=>{ clearTimeout(saveTimer); push(); });

/* Cmd+S dwingt af */
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='s'){
    e.preventDefault(); clearTimeout(saveTimer); push();
  }
});

/* en om de twintig seconden een veiligheidsronde */
setInterval(()=>{ if(JSON.stringify(m)!==lastSaved) push(); }, 20000);

let kaarten=['diner'];

let instTimer=null;
async function instHaal(){
  if(!SERVED) return;
  try{
    const r=await fetch('/api/instellingen');
    if(r.ok){ const d=await r.json(); INST={leg:d.leg||{}, letters:!!d.letters}; return; }
  }catch{}
  INST={leg:structuredClone(m.leg||{}), letters:!!m.letters};   /* eerste keer: uit deze kaart */
  instBewaar();
}
function instBewaar(){
  if(!SERVED) return;
  clearTimeout(instTimer);
  instTimer=setTimeout(()=>{
    fetch('/api/instellingen',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(INST)}).catch(()=>{});
  },400);
}

async function vulKaarten(){
  if(!SERVED) return $('kaart').hidden=true;
  try{ const r=await fetch('/api/kaarten'); if(r.ok) kaarten=(await r.json()).kaarten||kaarten; }catch{}
  if(!kaarten.includes(kaart)) kaarten.push(kaart);
  $('kaart').innerHTML = kaarten.map((x,i)=>
      `<button data-ga="${esc(x)}" class="${x===kaart?'actief':''}" title="${esc(x)}  (⌘${i+1})">${esc(x)}</button>`).join('')
    + '<button class="plus" data-nieuw="1" title="Nieuwe kaart">＋</button>';
}

async function ganaar(naam){
  if(naam===kaart) return;
  clearTimeout(saveTimer); await push();          /* huidige kaart eerst bewaren */
  kaart=naam; lastSaved='';
  await pull();
  localStorage.setItem('tafelaar-kaart',kaart);
  sel=null; selItem=null; past=[]; future=[];
  applyType(); drawForm(); draw(true); past=[snap()]; refreshHist(); drawInsp();
  vulKaarten();
}

async function nieuweKaart(){
  const soort = confirm('Nieuwe kaart maken.\n\nOK = lunchkaart (één A5)\nAnnuleer = dinerkaart (acht pagina\'s)')
    ? 'lunch' : 'diner';
  const ruw = prompt('Naam van de nieuwe kaart:', soort==='lunch'?'lunch':'diner');
  let naam=(ruw||'').trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'');
  if(!naam) return;
  if(kaarten.includes(naam)){
    alert('Er bestaat al een kaart met de naam "'+naam+'". Kies een andere naam.');
    return;
  }
  clearTimeout(saveTimer); await push();
  kaart=naam; m=structuredClone(soort==='lunch'?LUNCH:DEFAULT); lastSaved='';
  await push();
  localStorage.setItem('tafelaar-kaart',kaart);
  sel=null; selItem=null; past=[]; future=[];
  applyType(); drawForm(); draw(true); past=[snap()]; refreshHist(); drawInsp();
  vulKaarten();
}

$('kaart').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.nieuw) return nieuweKaart();
  if(b.dataset.ga) return ganaar(b.dataset.ga);
});

addEventListener('keydown',e=>{
  if(!(e.metaKey||e.ctrlKey) || e.shiftKey || e.altKey) return;
  const nr=parseInt(e.key,10);
  if(!nr || nr>kaarten.length) return;
  e.preventDefault(); ganaar(kaarten[nr-1]);
});

(async()=>{ await pull(); await instHaal(); await vulKaarten(); applyType(); drawForm(); _draw();
  past=[snap()]; refreshHist();
  if(SERVED) lastSaved=JSON.stringify(m); })();
</script>
